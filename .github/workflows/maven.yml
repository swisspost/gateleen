# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      release_only:
        description: 'Skip tests and release the current master version to Maven Central'
        required: false
        type: boolean
        default: false
  push:
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build_maven:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch complete history
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          server-id: central
          server-username: ${{ secrets.CI_DEPLOY_USERNAME }} # env variable for username in deploy
          server-password: ${{ secrets.CI_DEPLOY_PASSWORD }} # env variable for token in deploy
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: ${{ secrets.CI_GPG_PASSPHRASE }} # env variable for GPG private key passphrase

      - name: Start Redis
        if: ${{ !inputs.release_only }}
        uses: supercharge/redis-github-action@1.4.0
        with:
          redis-version: 4

      - name: Install chromedriver
        if: ${{ !inputs.release_only }}
        uses: nanasess/setup-chromedriver@v2

      - name: Set Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install, unit test
        if: ${{ !inputs.release_only }}
        run: mvn install -Dmaven.javadoc.skip=true -Dgpg.skip=true -PpublicRepos -B -V

      - name: Upload coverage reports to Codecov
        if: ${{ !inputs.release_only }}
        uses: codecov/codecov-action@v3

      - name: Non UI integration tests
        if: ${{ !inputs.release_only }}
        run: mvn install -Dgpg.skip=true -PnonUiIntegrationTests

      - name: UI integration tests
        if: ${{ !inputs.release_only }}
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

          java -jar gateleen-playground/target/playground.jar &> playground_logs.log &
          sleep 5s
          
          mvn deploy -PuploadStaticFiles -Dgpg.skip=true
          mvn install -Dgpg.skip=true -PuiIntegrationTests

      - name: Release to maven central
        if: github.ref_name == 'master' && github.event_name != 'pull_request' && github.repository == 'swisspost/gateleen'
        run: |
          set -euo pipefail

          # install sdkman if needed (used by maybe-release.sh)
          curl -s https://get.sdkman.io | bash

          # ensure SDKMAN_DIR and related vars are defined so 'set -u' doesn't fail when sourcing
          export SDKMAN_DIR="${SDKMAN_DIR:-$HOME/.sdkman}"
          export SDKMAN_CANDIDATES_API="${SDKMAN_CANDIDATES_API:-https://api.sdkman.io/2}"
          export SDKMAN_BROKER_API="${SDKMAN_BROKER_API:-https://broker.sdkman.io/1}"
          
          # sdkman-init.sh is not safe with set -u
          set +u
          source "$SDKMAN_DIR/bin/sdkman-init.sh"
          set -u

          # maven-gpg-plugin uses Maven's SecDispatcher to read the passphrase.
          # Provide an empty security settings file so its lookup does not fail.
          mkdir -p "$HOME/.m2"
          printf '%s\n' '<settingsSecurity/>' > "$HOME/.m2/settings-security.xml"

          # prepare isolated GNUPGHOME so runner keyring isn't touched
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          # import private key (from secret CI_GPG_PRIVATE_KEY)
          echo "$CI_GPG_PRIVATE_KEY" | gpg --batch --import

          # enable loopback pinentry for non-interactive signing
          printf '%s\n' 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"

          # reload gpg-agent
          gpgconf --kill gpg-agent || true
          sleep 1

          # export passphrase for maven (masked by GitHub Actions)
          export GPG_PASSPHRASE="$CI_GPG_PASSPHRASE"

          chmod +x ./maybe-release.sh
          # Forward the passphrase to Maven. The release wrapper preserves these arguments.
          ./maybe-release.sh -Dgpg.useGpgCmd=true -Dgpg.passphrase="$CI_GPG_PASSPHRASE"
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
          CI_GPG_PRIVATE_KEY: ${{ secrets.CI_GPG_PRIVATE_KEY }}

      - name: After release
        if: ${{ !inputs.release_only }}
        run: bash <(curl -s https://codecov.io/bash)
